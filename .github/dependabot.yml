version: 2
updates:

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for Composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain base images in Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/docker/development"
      - "/docker/production"
    schedule:
      interval: "daily"
    groups:
      php-base-image:
        patterns:
          - "php"
      node-base-image:
        patterns:
          - "node"
